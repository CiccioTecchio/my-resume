# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PORT: '{{default "8000" .PORT}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Start the local résumé server
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - python3 -m http.server {{.PORT}}
    preconditions:
      - sh: command -v python3
        msg: Python 3 is required to start the local server.

  presentation:
    desc: Generate the Beamer presentation PDF
    dir: "{{.TASKFILE_DIR}}/presentation"
    sources:
      - main.tex
    generates:
      - main.pdf
    cmds:
      - latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
    preconditions:
      - sh: command -v latexmk
        msg: latexmk is required to generate the presentation PDF.
